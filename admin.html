<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMPUS KZ — Админ-панель</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  background: #0a0a0c;
  color: #ececec;
  padding: 20px;
  min-height: 100vh;
}
h1 { color: #d4af37; margin-bottom: 20px; font-size: 24px; }
h2 { color: #d4af37; margin-top: 30px; font-size: 18px; }
.toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.btn {
  background: linear-gradient(135deg, #d4af37, #c9a030);
  color: #1a1a1a; border: none;
  padding: 10px 20px; border-radius: 8px; cursor: pointer;
  font-weight: 600; font-size: 14px; transition: all 0.3s ease;
}
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-secondary { background: #333; color: #fff; }
.btn-danger { background: #c0392b; color: #fff; }
#status { margin: 15px 0; padding: 12px 15px; border-radius: 8px; font-size: 13px; display: none; }
#status.show { display: block; }
.status-success { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid rgba(39, 174, 96, 0.3); }
.status-error { background: rgba(192, 57, 43, 0.2); color: #e74c3c; border: 1px solid rgba(192, 57, 43, 0.3); }
.status-info { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.3); }
table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #222; }
th { background: #1a1a1a; color: #d4af37; font-size: 11px; text-transform: uppercase; white-space: nowrap; }
td { font-size: 13px; vertical-align: top; }
td input, td textarea, td select {
  width: 100%; background: #1a1a22; border: 1px solid #333; color: #fff;
  padding: 6px; border-radius: 4px; font-size: 12px; font-family: inherit;
  transition: border-color 0.3s;
}
td input:focus, td textarea:focus, td select:focus { outline: none; border-color: #d4af37; }
td textarea { resize: vertical; min-height: 40px; }
.actions-cell { display: flex; gap: 5px; flex-wrap: wrap; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 4px; border: 1px solid #444;
  background: #222; color: #fff; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; transition: all 0.3s;
}
.icon-btn:hover { border-color: #d4af37; background: #333; }
.icon-btn.danger:hover { background: #c0392b; border-color: #c0392b; }
pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; margin-top: 20px; font-size: 12px; color: #8a8a94; border: 1px solid #222; max-height: 400px; overflow-y: auto; }
.github-info { background: rgba(212, 175, 55, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid rgba(212, 175, 55, 0.2); font-size: 13px; color: #8a8a94; }
.github-info b { color: #d4af37; }
@media (max-width: 768px) {
  table { font-size: 11px; }
  th, td { padding: 6px 4px; }
  .toolbar { flex-direction: column; }
  .btn { width: 100%; }
}
</style>
</head>
<body>

<h1>⚙️ TEMPUS KZ — Админ-панель</h1>

<div class="github-info">
  <b>🔗 GitHub:</b> TempusKZ / Tempus_KZ · Токен вшит · 
  <span style="color:#2ecc71;">✓ Автосохранение активно</span>
</div>

<div class="toolbar">
  <button class="btn" onclick="loadData()">📥 Загрузить data.json</button>
  <button class="btn" onclick="saveToGithub()">🚀 Сохранить на GitHub</button>
  <button class="btn btn-secondary" onclick="downloadJSON()">📥 Скачать JSON</button>
  <button class="btn btn-secondary" onclick="addRow()">➕ Добавить строку</button>
  <button class="btn btn-secondary" onclick="window.open('index.html', '_blank')">🏠 Открыть сайт</button>
</div>

<div id="status"></div>

<div style="overflow-x: auto;">
  <table id="dataTable">
    <thead>
      <tr>
        <th>Артикул</th>
        <th>Название</th>
        <th>Описание</th>
        <th>Категория</th>
        <th>Цена (₸)</th>
        <th>Кол-во</th>
        <th>Фото (URL через запятую)</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<h2>📄 Предпросмотр data.json:</h2>
<pre id="jsonPreview">Загрузка...</pre>

<script>
// ========== НАСТРОЙКИ GITHUB (вшиты) ==========
const GITHUB_CONFIG = {
  username: 'TempusKZ',
  repo: 'Tempus_KZ',
  token: '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',
  branch: 'main'
};

const LS_KEY = 'mdt_watches_v2';
let data = [];

// ========== GITHUB API ==========
async function saveToGithub() {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  showStatus('⏳ Отправка data.json на GitHub...', 'status-info');
  
  try {
    await pushFile('data.json', JSON.stringify(data, null, 2));
    showStatus('✅ data.json сохранён на GitHub! Сайт обновится через 1-2 минуты.', 'status-success');
  } catch (e) {
    showStatus('❌ Ошибка GitHub: ' + e.message, 'status-error');
  }
}

async function pushFile(path, content) {
  const encoded = btoa(unescape(encodeURIComponent(content)));
  const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.username}/${GITHUB_CONFIG.repo}/contents/${path}`;
  
  // Получаем SHA если файл существует
  let sha = null;
  try {
    const getResp = await fetch(apiUrl + '?ref=' + GITHUB_CONFIG.branch, {
      headers: {
        'Authorization': `token ${GITHUB_CONFIG.token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    if (getResp.ok) {
      const fileData = await getResp.json();
      sha = fileData.sha;
    }
  } catch (e) {}
  
  // Отправляем файл
  const body = {
    message: `Update ${path} - ${new Date().toISOString()}`,
    content: encoded,
    branch: GITHUB_CONFIG.branch
  };
  if (sha) body.sha = sha;
  
  const putResp = await fetch(apiUrl, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${GITHUB_CONFIG.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  
  if (!putResp.ok) {
    const errData = await putResp.json();
    throw new Error(errData.message || 'Ошибка отправки');
  }
}

// ========== ЗАГРУЗКА ДАННЫХ ==========
async function loadData() {
  showStatus('⏳ Загрузка данных...', 'status-info');
  
  // Пробуем загрузить из data.json
  try {
    const response = await fetch('data.json?_=' + Date.now());
    if (response.ok) {
      data = await response.json();
      renderTable();
      updatePreview();
      localStorage.setItem(LS_KEY, JSON.stringify(data));
      showStatus(`✅ Загружено из data.json: ${data.length} моделей`, 'status-success');
      return;
    }
  } catch (e) {}
  
  // Пробуем localStorage
  const lsData = localStorage.getItem(LS_KEY);
  if (lsData) {
    try {
      data = JSON.parse(lsData);
      renderTable();
      updatePreview();
      showStatus(`⚠️ Загружено из localStorage: ${data.length} моделей`, 'status-info');
      return;
    } catch (e) {}
  }
  
  data = [];
  renderTable();
  updatePreview();
  showStatus('📄 Данные не найдены. Создайте новую запись.', 'status-info');
}

// ========== ТАБЛИЦА ==========
function renderTable() {
  const tbody = document.getElementById('tableBody');
  
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:#8a8a94;">Нет данных. Нажмите "➕ Добавить строку"</td></tr>`;
    return;
  }
  
  tbody.innerHTML = data.map((item, index) => `
    <tr>
      <td><input type="text" value="${escapeAttr(item.article || '')}" data-idx="${index}" data-field="article" style="min-width:100px;"></td>
      <td><input type="text" value="${escapeAttr(item.name || '')}" data-idx="${index}" data-field="name" style="min-width:120px;"></td>
      <td><textarea data-idx="${index}" data-field="desc" style="min-width:150px;">${escapeHtml(item.desc || '')}</textarea></td>
      <td>
        <select data-idx="${index}" data-field="category">
          <option value="men" ${item.category === 'men' ? 'selected' : ''}>Мужские</option>
          <option value="women" ${item.category === 'women' ? 'selected' : ''}>Женские</option>
        </select>
      </td>
      <td><input type="number" value="${item.price || 0}" data-idx="${index}" data-field="price" style="min-width:90px;"></td>
      <td><input type="number" value="${item.qty || 0}" data-idx="${index}" data-field="qty" style="min-width:70px;"></td>
      <td><input type="text" value="${escapeAttr((item.images || []).join(', '))}" data-idx="${index}" data-field="imagesStr" style="min-width:150px;"></td>
      <td class="actions-cell">
        <button class="icon-btn" onclick="saveRow(${index})" title="Сохранить строку">💾</button>
        <button class="icon-btn" onclick="duplicateRow(${index})" title="Дублировать">📋</button>
        <button class="icon-btn danger" onclick="deleteRow(${index})" title="Удалить">🗑️</button>
      </td>
    </tr>
  `).join('');
  
  tbody.querySelectorAll('input, textarea, select').forEach(el => {
    el.addEventListener('change', function() {
      const idx = parseInt(this.getAttribute('data-idx'));
      saveRow(idx, true);
    });
  });
}

function saveRow(index, silent = false) {
  const inputs = document.querySelectorAll(`[data-idx="${index}"]`);
  
  inputs.forEach(input => {
    const field = input.getAttribute('data-field');
    let value = input.value;
    
    if (field === 'price' || field === 'qty') {
      value = Number(value) || 0;
    } else if (field === 'imagesStr') {
      const images = value.split(',').map(s => s.trim()).filter(s => s);
      data[index].images = images;
      return;
    }
    
    data[index][field] = value;
  });
  
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  updatePreview();
  
  if (!silent) {
    showStatus(`✅ Строка ${index + 1} сохранена в localStorage`, 'status-success');
  }
}

function deleteRow(index) {
  const name = data[index].name || data[index].article || 'без названия';
  if (confirm(`Удалить модель "${name}"?`)) {
    data.splice(index, 1);
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    renderTable();
    updatePreview();
    showStatus('🗑️ Модель удалена', 'status-success');
  }
}

function duplicateRow(index) {
  const newItem = JSON.parse(JSON.stringify(data[index]));
  newItem.article = (newItem.article || '') + '-copy';
  newItem.name = (newItem.name || '') + ' (копия)';
  data.splice(index + 1, 0, newItem);
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  renderTable();
  updatePreview();
  showStatus('📋 Модель дублирована', 'status-success');
}

function addRow() {
  data.push({
    article: 'TK-' + new Date().getFullYear() + '-' + String(data.length + 1).padStart(3, '0'),
    name: '',
    desc: '',
    category: 'men',
    price: 0,
    qty: 0,
    images: []
  });
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  renderTable();
  updatePreview();
  showStatus('➕ Новая строка добавлена', 'status-success');
}

function updatePreview() {
  document.getElementById('jsonPreview').textContent = JSON.stringify(data, null, 2);
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(url);
  showStatus('📥 data.json скачан', 'status-success');
}

function showStatus(message, className) {
  const status = document.getElementById('status');
  status.textContent = message;
  status.className = 'show ' + className;
  if (className === 'status-success') {
    setTimeout(() => { status.classList.remove('show'); }, 4000);
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function escapeAttr(s) {
  if (!s) return '';
  return String(s).replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ========== ЗАПУСК ==========
loadData();
</script>

</body>
</html>
